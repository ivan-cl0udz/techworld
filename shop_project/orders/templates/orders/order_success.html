<!DOCTYPE html>
<html lang="uk">


<head>
    <meta charset="UTF-8">
    <title>Дякуємо за замовлення | TechWorld</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #1F2937; /* gray-800 */
            color: #F9FAFB; /* gray-50 */
            font-family: 'Inter', sans-serif;
        }
        .accent {
            color: #38BDF8; /* cyan-400 */
        }
        .btn-primary {
            background-color: #38BDF8;
            color: #1F2937;
        }
        .btn-primary:hover {
            background-color: #0EA5E9;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-gray-900 shadow-sm py-3 px-6 flex justify-between items-center border-b border-gray-700">
        <a href="{% url 'shop:start' %}" class="font-bold text-2xl accent">TechWorld</a>
        <nav>


        </nav>
    </header>

    <!-- Main content -->
    <main class="flex-1 flex flex-col justify-center items-center text-center px-6">
        <div class="bg-gray-800 rounded-xl shadow-lg p-10 max-w-md border border-gray-700">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-16 h-16 mx-auto mb-6 text-green-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2l4-4m6 2a9 9 0 11-18 0a9 9 0 0118 0z" />
            </svg>

            <h1 class="text-3xl font-bold mb-4">Дякуємо за ваше замовлення!</h1>
            <p class="text-gray-300 mb-6">Ми отримали ваше замовлення та вже почали його обробку.<br>Ви отримаєте підтвердження на електронну пошту найближчим часом.</p>
            <p style="text-align:center; margin-top: 20px;">
    <a href="{% url 'shop:order_history' %}"
       style="background-color: #28a745; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px;">
       Історія замовлень
    </a>
</p>
            <a href="{% url 'shop:start' %}" class="btn-primary px-6 py-3 rounded-lg font-semibold inline-block mt-4">
                Повернутися на головну
            </a>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-sm text-gray-500 border-t border-gray-700 mt-10">
        © {{ now|date:"Y" }} TechWorld. Всі права захищені.
    </footer>

</body>
</html>
