<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Реєстрація | TechWorld</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #1F2937;
      color: #F9FAFB;
      font-family: 'Inter', sans-serif;
    }
    .accent { color: #38BDF8; }
    .btn-primary {
      background-color: #38BDF8;
      color: #1F2937;
    }
    .btn-primary:hover {
      background-color: #0EA5E9;
    }
    .link {
      color: #38BDF8;
    }
    .link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-900">

  <div class="bg-gray-800 p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-700">
    <h1 class="text-3xl font-bold text-center mb-6 accent">Створити акаунт</h1>

    <form method="post" class="space-y-5">
      {% csrf_token %}
      {{ form.as_p }}

      <button type="submit" class="w-full btn-primary py-2 rounded-lg font-semibold text-lg">
        Зареєструватись
      </button>
    </form>

    <p class="text-center text-gray-400 mt-6">
      Вже маєте акаунт?
      <a href="{% url 'shop:login' %}" class="link">Увійдіть</a>
    </p>

    <p class="text-center text-gray-500 text-sm mt-4">
      <a href="{% url 'shop:start' %}" class="hover:underline">← На головну</a>
    </p>
  </div>

</body>
</html>
